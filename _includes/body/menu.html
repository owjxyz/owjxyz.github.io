<div id="_navbar" class="navbar fixed-top">
  <div class="content">
    <span class="sr-only">{{ site.data.strings.jump_to | default:"Jump to" }}{{ site.data.strings.colon | default:":" }}</span>
    <div class="nav-btn-bar">
      <a id="_menu" class="nav-btn no-hover" href="#_drawer--opened">
        <span class="sr-only">{{ site.data.strings.navigation | default:"Navigation" }}</span>
        <span class="icon-menu"></span>
      </a>
      <button id="_search" class="nav-btn no-hover" type="button" aria-label="Search" aria-expanded="false" aria-controls="_search-box" data-index-url="{{ '/assets/search-index.json' | relative_url }}">
        <span class="icon-search" aria-hidden="true"></span>
      </button>
      <div id="_search-box" aria-hidden="true">
        <div class="nav-btn" aria-hidden="true"><span class="icon-search"></span></div>
        <input id="_search-input" type="search" class="form-control form-control-lg nav-btn" placeholder="Type something…" aria-label="Search" autocomplete="off">
        <button id="_search-close" type="button" class="nav-btn no-hover" aria-label="Close search"><span class="icon-cross" aria-hidden="true"></span></button>
      </div>
      <div id="_hits" hidden aria-live="polite"></div>
      <div class="nav-span"></div>
    </div>
  </div>
</div>
<hr class="sr-only" hidden />
